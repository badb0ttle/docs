name: 部署文档

on:
  push:
    branches:
      - main

permissions:
  contents: write

# 添加全局环境变量，强制 Actions 使用 Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 升级到 v4，支持更高的 Node 版本
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          # 建议升级到 22 或 24，避免 20 带来的弃用风险
          node-version: 24
          cache: pnpm

      - name: 确保 pnpm 可用
        run: echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: 安装依赖
        shell: bash
        run: pnpm install

      - name: 构建文档
        env:
          # 针对大型算法文档，增加内存限制是明智的
          NODE_OPTIONS: --max_old_space_size=8192
        run: |-
          pnpm run docs:build
          touch src/.vuepress/dist/.nojekyll

      - name: 部署文档
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/.vuepress/dist

  deploy:
    needs: deploy-gh-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
